name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  catalog:
    # These names are required by the repository's branch protection.
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check source catalog
        run: python scripts/check.py

      - name: Check diff formatting
        run: git diff --check HEAD^
